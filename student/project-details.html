<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project details · WIMG</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/projects.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html"
          >◉ <span>Where Is My</span> Groupmate?</a
        >
        <nav>
          <a href="dashboard.html">⌂ Dashboard</a
          ><a href="projects.html">▣ My projects</a
          ><a href="tasks.html">✓ Tasks</a
          ><a href="contributions.html">◔ Contributions</a
          ><a href="peer-evaluation.html">★ Peer evaluation</a
          ><a href="notifications.html">♢ Notifications</a
          ><a href="profile.html">◉ Profile</a>
        </nav>
      </aside>
      <main class="app-main">
        <header class="topbar">
          <div>
            <a href="projects.html">← Back to projects</a>
            <h1>Project details</h1>
          </div>
          <div class="topbar-actions">
            <a class="button button-primary" href="tasks.html">View tasks</a>
          </div>
        </header>
        <section id="project-form-panel" class="panel">
          <div class="panel-header">
            <h2 id="project-form-title">Create project</h2>
          </div>
          <form id="project-form" class="form-stack">
            <label>Project name<input name="name" required /></label>
            <label>Description<textarea name="description" rows="4"></textarea></label>
            <label>Deadline<input name="deadline" type="date" required /></label>
            <label>Status<select name="status" required>
              <option>Planning</option>
              <option>In Progress</option>
              <option>On Hold</option>
            </select></label>
            <p id="project-form-message" class="form-message"></p>
            <button class="button button-primary" type="submit">Save project</button>
          </form>
        </section>
        <div id="project-details"></div>
      </main>
    </div>
    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/projects.js"></script>
  </body>
</html>
