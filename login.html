<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in · WIMG</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-page">
    <a class="brand auth-brand" href="index.html"
      >◉ <span>Where Is My</span> Groupmate?</a
    >
    <main class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to your workspace</h1>
      <form id="login-form" class="form-stack">
        <label
          >Email<input
            name="email"
            type="email"
            placeholder="you@university.edu"
            required /></label
        ><label
          >Password<input type="password" placeholder="••••••••" required
        /></label>
        <div class="form-options">
          <label class="check"><input type="checkbox" /> Remember me</label
          ><a href="#">Forgot password?</a>
        </div>
        <button class="button button-primary" type="submit">Log in</button>
      </form>
      <p class="auth-switch">
        New here? <a href="register.html">Create an account</a>
      </p>
      <p id="auth-message" class="form-message" aria-live="polite"></p>
    </main>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
