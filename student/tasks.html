<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tasks · WIMG</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/tasks.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html"
          >◉ <span>Where Is My</span> Groupmate?</a
        >
        <nav>
          <a href="dashboard.html">⌂ Dashboard</a
          ><a href="projects.html">▣ My projects</a
          ><a href="tasks.html">✓ Tasks</a
          ><a href="contributions.html">◔ Contributions</a
          ><a href="peer-evaluation.html">★ Peer evaluation</a
          ><a href="notifications.html">♢ Notifications</a
          ><a href="profile.html">◉ Profile</a>
        </nav>
      </aside>
      <main class="app-main">
        <header class="topbar">
          <div>
            <h1>Tasks</h1>
            <p id="tasks-project-label">Project tasks</p>
          </div>
          <div class="topbar-actions">
            <button id="add-task" class="button button-primary">
              + Add task
            </button>
          </div>
        </header>
        <div class="task-toolbar">
          <div class="page-tabs">
            <a class="active" href="#">All tasks</a><a href="#">Mine</a>
          </div>
          <select id="task-filter">
            <option>All</option>
            <option>To Do</option>
            <option>In Progress</option>
            <option>Completed</option>
          </select>
        </div>
        <table class="task-table">
          <thead>
            <tr>
              <th>Task</th>
              <th>Assignee</th>
              <th>Due date</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="task-body"></tbody>
        </table>
        <dialog id="task-modal" class="task-modal">
          <div class="modal-content">
            <h2>Add a task</h2>
            <form id="task-form" class="form-stack">
              <label>Task title<input name="title" required /></label>
              <label>Description<textarea name="description" rows="3"></textarea></label>
              <label>Project<select name="projectId" required></select></label>
              <label>Assign to<select name="assignedTo" required></select></label>
              <label>Deadline<input name="deadline" type="date" required /></label>
              <label>Status<select name="status" required>
                <option>To Do</option>
                <option>In Progress</option>
                <option>Completed</option>
              </select></label>
              <p id="task-form-message" class="form-message"></p>
              <div class="modal-actions">
                <button
                  type="button"
                  data-close-modal
                  class="button button-ghost"
                >
                  Cancel</button
                ><button class="button button-primary" type="submit">Add task</button>
              </div>
            </form>
          </div>
        </dialog>
      </main>
    </div>
    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tasks.js"></script>
  </body>
</html>
