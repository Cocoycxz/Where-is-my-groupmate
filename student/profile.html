<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile · WIMG</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html"
          >◉ <span>Where Is My</span> Groupmate?</a
        >
        <nav>
          <a href="dashboard.html">⌂ Dashboard</a
          ><a href="projects.html">▣ My projects</a
          ><a href="tasks.html">✓ Tasks</a
          ><a href="contributions.html">◔ Contributions</a
          ><a href="peer-evaluation.html">★ Peer evaluation</a
          ><a href="notifications.html">♢ Notifications</a
          ><a href="profile.html">◉ Profile</a>
        </nav>
      </aside>
      <main class="app-main">
        <header class="topbar">
          <div>
            <h1>My profile</h1>
            <p>Manage your workspace identity.</p>
          </div>
        </header>
        <section class="panel">
          <div class="member-row">
            <span
              class="avatar violet"
              style="width: 60px; height: 60px; font-size: 17px"
              id="profile-initials"
              >AR</span
            >
            <div>
              <h2 id="profile-name">Current user</h2>
              <p id="profile-email" class="muted"></p>
            </div>
          </div>
          <form id="profile-form" class="form-stack">
            <label>Display name<input name="name" /></label
            ><label>Email<input name="email" type="email" readonly /></label
            ><label>Course / program<input name="course" /></label
            ><p id="profile-message" class="form-message"></p
            ><button class="button button-primary" type="submit">
              Save changes
            </button>
          </form>
        </section>
      </main>
    </div>
    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
